          <h1>ProdSync — Production Management Platform</h1>
          <p>ProdSync is a production management platform built specifically for film and media production teams. It provides centralized tools to plan, coordinate, and execute every aspect of a production — from pre-production logistics to final wrap.</p>
          <p>ProdSync is developed by <strong>Tubelight Mediaworks</strong>.</p>
          <h2>Who is ProdSync for?</h2>
          <p>ProdSync is designed for executive producers, production managers, and department heads managing film, TV, web series, commercial, or media productions. It consolidates crew planning, logistics, expenses, approvals, and reporting in one collaborative platform.</p>
          <h2>Core Capabilities</h2>
          <ul>
            <li>Project Management — production projects, phases, and planning</li>
            <li>Crew Planning — schedule and manage crew across all departments</li>
            <li>Cast &amp; Actor Management — call times, schedules, logistics</li>
            <li>Expense &amp; Budget Tracking — per-department budgets and daily wages</li>
            <li>Location Management — shooting locations, maps, logistics</li>
            <li>Transport &amp; Logistics — vehicles, drivers, crew/cast transport</li>
            <li>Food &amp; Beverages — catering, meal schedules, food costs</li>
            <li>Accommodation &amp; Travel — hotel bookings and travel coordination</li>
            <li>Camera &amp; Assets — equipment, props, and production assets</li>
            <li>Wardrobe &amp; Makeup — wardrobe management for cast and crew</li>
            <li>Approval Workflows — structured approvals for budgets and decisions</li>
            <li>Production Reports — exportable reports for expenses and activity</li>
            <li>Real-time Collaboration — live updates across all team members</li>
          </ul>
